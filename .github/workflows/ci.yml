name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            eslint: 9.39.0
          - node: 24
            eslint: 10.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false eslint@${{ matrix.eslint }}
      - run: npm run check
      - run: npm pack --dry-run
