name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.runtime.node }} / ESLint ${{ matrix.runtime.eslint }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        runtime:
          - node: 22
            eslint: 9.39.0
          - node: 24
            eslint: 10.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.runtime.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false eslint@${{ matrix.runtime.eslint }}
      - run: npm run check
      - run: npm pack --dry-run
